# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true
# Forge 1.20.1 toolchain requires running on Java 17
org.gradle.java.home = C:\\Program Files\\Java\\jdk-17

# Mod info
mod_id = create_cannon_plus
mod_name = Create: Cannon Plus
mod_version = 0.2.0
mod_author = gmfCoding
mod_description = Adds a block skip-list to the Schematicannon, configured through Create's clipboard. Insert a clipboard into the cannon to print every needed block, tick the ones to skip, and reinsert it to skip them while printing.
mod_license = MIT

# Minecraft / Forge
minecraft_version = 1.20.1
# Classic Forge for 1.20.1 (maven.minecraftforge.net), same version Create 6.0.8 is built with.
forge_version = 47.1.33

# Create dev-environment dependency (official Create wiki, forge-1.20.1):
# https://wiki.createmod.net/developers/depend-on-create/forge-1.20.1
# 6.0.8-289 is the maven build that exactly matches the release 6.0.8 jar.
create_version = 6.0.8-289
ponder_version = 1.0.91
flywheel_version = 1.0.5
registrate_version = MC1.20-1.3.3

# Mixin
mixin_version = 0.8.5
